<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Fish Keeper - a one-stop aquarium store for ornamental fish, equipment, food and aquascaping. Live cold-chain shipping, 7-day health guarantee.">
    <meta name="theme-color" content="#0a7d8c">
    <title>Fish Keeper · Aquarium Lifestyle Store</title>
    <link rel="canonical" href="https://www.fish-keeper.com/">

    <!-- Open Graph / 社交分享 -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Fish Keeper · Aquarium Lifestyle Store">
    <meta property="og:description" content="A one-stop aquarium store for ornamental fish, equipment, food and aquascaping. Live cold-chain shipping, 7-day health guarantee.">
    <meta property="og:image" content="images/hero.jpg">
    <meta property="og:url" content="https://www.fish-keeper.com/">
    <meta name="twitter:card" content="summary_large_image">

    <!-- 网站图标 -->
    <link rel="icon" href="images/fishkeeper-logo.jpg">

    <!-- 结构化数据 (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Store",
      "name": "Fish Keeper",
      "description": "A one-stop aquarium store for ornamental fish, equipment, food and aquascaping.",
      "url": "https://www.fish-keeper.com/",
      "logo": "https://www.fish-keeper.com/images/fishkeeper-logo.jpg",
      "sameAs": []
    }
    </script>

    <!-- 样式 -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/home.css">
</head>
<body id="top">

<a href="#main" class="skip-link">Skip to main content</a>

<!-- 公共 partial（通过 fetch 加载） -->
<div id="header-slot"></div>
<div id="search-slot"></div>

<main id="main">

    <!-- ============================================================
         1. Hero 首屏（左文字 + 右图片）
         ============================================================ -->
    <section class="hero">
        <div class="container">
            <div class="hero-inner">
                <div class="hero-text">
                    <span class="hero-eyebrow" id="hero-badge"></span>
                    <h1 id="hero-title"></h1>
                    <p class="hero-desc" id="hero-desc"></p>
                    <div class="hero-cta" id="hero-cta"></div>
                </div>
                <div class="hero-visual">
                    <div class="hero-img-wrap">
                        <img id="hero-image" alt="" class="hero-main-img" width="600" height="700">
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- ============================================================
         2. 服务保障（浮动卡片网格，与 hero 底部重叠）
         ============================================================ -->
    <section class="services">
        <div class="container">
            <div class="services-grid" id="services-grid"></div>
        </div>
    </section>

    <!-- ============================================================
         3. 分类展示（3列图片卡片网格）
         ============================================================ -->
    <section class="section section-alt" id="categories">
        <div class="container">
            <div class="section-head-row reveal">
                <div class="section-head-text">
                    <span class="section-eyebrow" id="cat-eyebrow"></span>
                    <h2 class="section-title" id="cat-title"></h2>
                    <p class="section-sub" id="cat-sub"></p>
                </div>
                <a href="/shop/" class="btn btn-outline-dark">View All Categories <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg></a>
            </div>
            <div class="categories-grid" id="categories-grid"></div>
        </div>
    </section>

    <!-- ============================================================
         4. 畅销产品（标签页切换产品网格）
         ============================================================ -->
    <section class="section" id="products">
        <div class="container">
            <div class="section-head-row reveal">
                <div class="section-head-text">
                    <span class="section-eyebrow" id="hp-eyebrow"></span>
                    <h2 class="section-title" id="hp-title"></h2>
                    <p class="section-sub" id="hp-sub"></p>
                </div>
                <a href="/shop/" class="btn btn-outline-dark" id="hp-viewall"></a>
            </div>
            <div class="tabs home-tabs" id="hp-tabs" role="tablist" aria-label="Product category filter"></div>
            <div class="products" id="products-grid">
                <!-- 由 ProductRenderer 从 data/products.json 渲染 -->
            </div>
        </div>
    </section>

    <!-- ============================================================
         5. 品牌故事（左图片 + 右文字）
         ============================================================ -->
    <section class="section brand-section" id="brand">
        <div class="container">
            <div class="brand-wrap">
                <div class="brand-visual reveal">
                    <div class="brand-img-main">
                        <img id="brand-image" alt="" loading="lazy" width="700" height="520">
                    </div>
                    <div class="brand-badge" id="brand-badge"></div>
                </div>
                <div class="brand-text reveal">
                    <span class="section-eyebrow" id="brand-eyebrow"></span>
                    <h2 id="brand-title"></h2>
                    <p class="brand-lead" id="brand-lead"></p>
                    <p id="brand-desc"></p>
                    <div class="brand-stats" id="brand-stats"></div>
                    <a id="brand-cta" class="btn btn-primary brand-btn"></a>
                </div>
            </div>
        </div>
    </section>

</main>

<!-- 公共 partial -->
<div id="footer-slot"></div>

<!-- JS：app → products → home（home 定义 renderProducts/initTabs 供 bootApp 调用） -->
<script src="js/app.js"></script>
<script src="js/products.js"></script>
<script src="js/home.js"></script>

<script>
bootApp([
    { url: 'partials/header.html',        mountId: 'header-slot' },
    { url: 'partials/search-modal.html',  mountId: 'search-slot' },
    { url: 'partials/footer.html',        mountId: 'footer-slot' }
]);
</script>

</body>
</html>
